version: '3.8'

services:
  # 🗄️ Database MongoDB
  mongo:
    image: mongo:6.0-alpine
    container_name: class-ledger-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: kas-kelas
    volumes:
      - mongo_data:/data/db
    networks:
      - class-ledger-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚙️ Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: class-ledger-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/kas-kelas
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-in-production-random-32-chars}
      JWT_EXPIRES_IN: 7d
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80,http://localhost:5000,http://localhost:5173}
      FONNTE_API_TOKEN: ${FONNTE_API_TOKEN:-}
      FONNTE_GROUP_ID: ${FONNTE_GROUP_ID:-}
      WA_TEST_MODE: ${WA_TEST_MODE:-false}
      AUTO_REMINDER_ENABLED: ${AUTO_REMINDER_ENABLED:-true}
    volumes:
      - ./server/public/reports:/app/public/reports
      - ./server/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - class-ledger-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 🎨 Frontend Web UI
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: class-ledger-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - class-ledger-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  class-ledger-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
