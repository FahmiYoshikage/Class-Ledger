<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Neon Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Rim -->
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#edgeGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Ambient Light Glow behind Vault -->
  <circle cx="256" cy="240" r="160" fill="url(#shieldGrad)" opacity="0.35" filter="url(#ambientLight)"/>

  <!-- Geometric Hexagon Shield / Vault Body -->
  <g filter="url(#neonGlow)">
    <!-- Outer Vault Hexagon -->
    <polygon points="256,76 416,168 416,344 256,436 96,344 96,168" 
             fill="#18181b" 
             stroke="url(#shieldGrad)" 
             stroke-width="12" 
             stroke-linejoin="round"/>

    <!-- Inner Concentric Vault Rim -->
    <polygon points="256,112 384,186 384,326 256,400 128,326 128,186" 
             fill="none" 
             stroke="url(#innerGlow)" 
             stroke-width="3" 
             stroke-dasharray="12, 8"
             opacity="0.6"/>

    <!-- Center Vault Core (Circle with Currency/Ledger Emblem) -->
    <circle cx="256" cy="256" r="82" fill="#09090b" stroke="url(#shieldGrad)" stroke-width="8"/>
    <circle cx="256" cy="256" r="68" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>

    <!-- Modern Geometric "C" & "L" / Coin Nodes -->
    <!-- Stylized "K" & "L" intersecting nodes -->
    <path d="M 232,216 L 232,296 M 232,256 L 276,216 M 248,246 L 282,296" 
          stroke="url(#innerGlow)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Top & Bottom Pulse Orbs -->
    <circle cx="256" cy="142" r="7" fill="#38BDF8"/>
    <circle cx="256" cy="370" r="7" fill="#EC4899"/>
    <circle cx="156" cy="256" r="6" fill="#8B5CF6"/>
    <circle cx="356" cy="256" r="6" fill="#8B5CF6"/>
  </g>

  <!-- High Tech Corner Accent Marks -->
  <path d="M 40,90 L 40,40 L 90,40" fill="none" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 472,90 L 472,40 L 422,40" fill="none" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 40,422 L 40,472 L 90,472" fill="none" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 472,422 L 472,472 L 422,472" fill="none" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>