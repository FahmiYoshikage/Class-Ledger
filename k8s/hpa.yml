apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kas-kelas-api-hpa
  namespace: kas-kelas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kas-kelas-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kas-kelas-frontend-hpa
  namespace: kas-kelas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kas-kelas-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70