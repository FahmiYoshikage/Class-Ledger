apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: kas-kelas
data:
  NODE_ENV: production
  PORT: "5000"
  CORS_ORIGIN: https://kas-kelas.yourdomain.com
  NODE_OPTIONS: "--enable-source-maps"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: kas-kelas
data:
  VITE_API_URL: "/api"
  VITE_ENV: production