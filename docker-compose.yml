version: '3.8'

services:
    # Backend API
    api:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: kas-kelas-api
        restart: unless-stopped
        # Expose to host on port 5001 (not 5000 to avoid conflict)
        ports:
            - '5001:5000'
        env_file:
            - ./server/.env.production
        volumes:
            - ./server/public/reports:/app/public/reports
            - ./server/uploads:/app/uploads
        networks:
            - kas-kelas-network
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:5000/api/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # Frontend (Nginx)
    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
        container_name: kas-kelas-frontend
        restart: unless-stopped
        # Expose to host on port 8767 (different from nginx host port 8766)
        ports:
            - '8767:80'
        depends_on:
            - api
        networks:
            - kas-kelas-network

networks:
    kas-kelas-network:
        driver: bridge
