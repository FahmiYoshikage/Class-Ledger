services:
    # Backend API (optimized for 1GB RAM / 2 vCPU VPS)
    api:
        build:
            context: ./server
            dockerfile: Dockerfile
            # Build-time memory control (hindari freeze di VPS 1GB)
            args:
                NODE_OPTIONS_BUILD: "--max-old-space-size=256"
        container_name: kas-kelas-api
        restart: unless-stopped
        ports:
            - '5001:5000'
        env_file:
            - ./server/.env.production
        # Runtime Node flags (akan menggantikan default di Dockerfile)
        environment:
            NODE_OPTIONS: '--max-old-space-size=192'
        volumes:
            - ./server/public/reports:/app/public/reports
            - ./server/uploads:/app/uploads
        networks:
            - omnigrid-net
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:5000/api/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 256M
                reservations:
                    cpus: '0.25'
                    memory: 96M
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '2'

    # Frontend (Nginx, minimal footprint)
    # NOTE: Jalankan ./deploy.sh untuk build frontend terlebih dahulu.
    # Dockerfile frontend hanya COPY dist/ ke nginx (tanpa Node.js build stage).
    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
        container_name: kas-kelas-frontend
        restart: unless-stopped
        ports:
            - '8767:80'
        depends_on:
            api:
                condition: service_healthy
        networks:
            - omnigrid-net
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:80']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 64M
                reservations:
                    cpus: '0.1'
                    memory: 32M
        logging:
            driver: 'json-file'
            options:
                max-size: '3m'
                max-file: '2'

networks:
    omnigrid-net:
        external: true