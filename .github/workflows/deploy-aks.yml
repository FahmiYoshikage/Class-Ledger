name: Deploy to AKS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AKS_NAME: kas-kelas-aks
  AKS_NAMESPACE: kas-kelas
  REGISTRY: fahmi
  IMAGE_API: kas-kelas-api
  IMAGE_FRONTEND: kas-kelas-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.set-output.outputs.api_image }}
      frontend_image: ${{ steps.set-output.outputs.frontend_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        id: api-build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${IMAGE_API}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${IMAGE_API}:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${IMAGE_API}:cache,mode max

      - name: Set API image output
        run: echo "api_image=${{ secrets.DOCKER_USERNAME }}/${IMAGE_API}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Frontend image
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${IMAGE_FRONTEND}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${IMAGE_FRONTEND}:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${IMAGE_FRONTEND}:cache,mode max

      - name: Set Frontend image output
        run: echo "frontend_image=${{ secrets.DOCKER_USERNAME }}/${IMAGE_FRONTEND}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "1.30.0"

      - name: Install Azure CLI
        uses: azure/cli@v2
        with:
          version: "2.60.0"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        run: |
          az aks get-credentials \
            --name ${{ env.AKS_NAME }} \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --overwrite-existing

      - name: Update Deployment images
        run: |
          kubectl set image deployment/kas-kelas-api kas-kelas-api=${{ steps.api-build.outputs.api_image }} -n ${{ env.AKS_NAMESPACE }}
          kubectl set image deployment/kas-kelas-frontend kas-kelas-frontend=${{ steps.frontend-build.outputs.frontend_image }} -n ${{ env.AKS_NAMESPACE }}

      - name: Apply K8s manifests
        run: |
          kubectl apply -k k8s/ -n ${{ env.AKS_NAMESPACE }}

      - name: Apply HPA configs
        run: |
          kubectl apply -f k8s/hpa.yml -n ${{ env.AKS_NAMESPACE }}

      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/kas-kelas-api -n ${{ env.AKS_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/kas-kelas-frontend -n ${{ env.AKS_NAMESPACE }} --timeout=120s

      - name: Ingress status
        run: |
          kubectl get ingress -n ${{ env.AKS_NAMESPACE }}